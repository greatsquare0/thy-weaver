name: Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.repository == 'greatsquare0/thy-weaver'

    outputs:
      changesets: ${{ steps.filter.outputs.changesets }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if changeset folder changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changesets:
              - ".changeset/**"

  release:
    permissions:
      id-token: write # npm trusted publishing (OIDC) and provenance
      contents: write
      issues: write
      pull-requests: write
    needs:
      - changes
    # Manual runs retry a release (e.g. stage packages again) without a new changeset
    if: ${{ needs.changes.outputs.changesets == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # `npm stage` needs npm 11.15+, the one bundled with Node 24 is newer
      - name: Check npm version
        run: npm --version

      # No npm token: packages are staged through trusted publishing (OIDC) and
      # only go live once a maintainer approves them with 2FA on npmjs.com.
      # See scripts/stage-publish.mjs
      - name: Create Release Pull Request or Stage on npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run ci:version
          publish: node scripts/stage-publish.mjs
          commit: "[chore] version bumped"
          title: "[chore] version bumped"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
