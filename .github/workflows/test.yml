name: Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Type-check tests
        run: pnpm run test:types

      - name: Unit tests
        run: pnpm exec vitest run --project unit

      # Tweego and Neutralino downloads used by the e2e tests
      - name: Cache e2e downloads
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/thyweaver-e2e
          key: ${{ runner.os }}-thyweaver-e2e-v1

      - name: E2E tests
        run: pnpm exec vitest run --project e2e
