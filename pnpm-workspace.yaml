injectWorkspacePackages: false

packages:
  - packages/*

# Only install package versions published at least 7 days ago (in minutes, enforced by pnpm >= 10.16)
minimumReleaseAge: 10080

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: false

catalog:
  "@tsconfig/node24": "24.0.5"
  "@types/node": "24.19.2"
  ora: "10.0.0"
  picocolors: "1.1.1"
  tinyglobby: "0.2.17"
  tsdown: "0.23.7"
  typescript: "7.0.2"
